<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>14 de Febrero 💝</title>

<style>
    body{
        margin:0;
        overflow:hidden;
        background:black;
        font-family: "Segoe UI", sans-serif;
        color:white;
        text-align:center;
    }

    /* VIDEO */
    video{
        position:fixed;
        width:100%;
        height:100%;
        object-fit:cover;
        z-index:-2;
    }

    /* GALAXIA */
    .galaxy{
        position:absolute;
        top:50%;
        left:50%;
        width:300px;
        height:300px;
        transform:translate(-50%,-50%);
        border-radius:50%;
        box-shadow:
            0 0 80px #8f5cff,
            0 0 150px #5c9cff,
            0 0 200px #ff5cd9;
        animation:spin 40s linear infinite;
    }

    @keyframes spin{
        from{ transform:translate(-50%,-50%) rotate(0deg); }
        to{ transform:translate(-50%,-50%) rotate(360deg); }
    }

    /* TEXTO CENTRAL */
    .mensaje{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        width:80%;
        max-width:600px;
        font-size:22px;
        line-height:1.5;
        text-shadow:0 0 15px #ff9df5;
    }

    /* TEXTO GIRATORIO */
    .orbita{
        position:absolute;
        top:50%;
        left:50%;
        width:420px;
        height:420px;
        transform:translate(-50%,-50%);
        animation:orbitar 25s linear infinite;
    }

    @keyframes orbitar{
        from{ transform:translate(-50%,-50%) rotate(0deg);}
        to{ transform:translate(-50%,-50%) rotate(360deg);}
    }

    .letra{
        position:absolute;
        top:50%;
        left:50%;
        transform-origin:0 -200px;
        font-size:18px;
        text-shadow:0 0 8px #fff;
    }

    /* MARIPOSAS */
    .butterfly{
        position:fixed;
        font-size:35px;
        animation:flotar 4s ease-in-out infinite alternate;
    }

    @keyframes flotar{
        from{ transform:translateY(0px);}
        to{ transform:translateY(15px);}
    }

    .b1{top:10px;left:10px;}
    .b2{top:10px;right:10px;}
    .b3{bottom:10px;left:10px;}
    .b4{bottom:10px;right:10px;}

</style>
</head>
<body>

<!-- VIDEO -->
<video id="video" autoplay muted>
    <source src="video.mp4" type="video/mp4">
</video>

<!-- GALAXIA -->
<div class="galaxy"></div>

<!-- TEXTO GIRATORIO -->
<div class="orbita" id="orbita"></div>

<!-- MENSAJE -->
<div class="mensaje">
Para mí, tú eres mi mundo entero.<br>
Hoy 14 de febrero agradezco tenerte conmigo.<br>
Cada momento contigo es un tesoro,<br>
y siempre deseo que nuestra historia continúe brillando como las estrellas. 💝
</div>

<!-- MARIPOSAS -->
<div class="butterfly b1">🦋</div>
<div class="butterfly b2">🦋</div>
<div class="butterfly b3">🦋</div>
<div class="butterfly b4">🦋</div>

<script>

/* TEXTO QUE GIRA ALREDEDOR */
const frase = " TE AMO POR SIEMPRE ✨ ";
const orbita = document.getElementById("orbita");

for(let i=0;i<frase.length;i++){
    const span = document.createElement("span");
    span.className="letra";
    span.innerText = frase[i];
    span.style.transform = rotate(${i*(360/frase.length)}deg) translate(-50%, -200px) rotate(${-(i*(360/frase.length))}deg);
    orbita.appendChild(span);
}

/* VIDEO SOLO 10 SEGUNDOS LOOP */
const video = document.getElementById("video");

video.addEventListener("timeupdate",()=>{
    if(video.currentTime >= 10){
        video.currentTime = 0;
        video.play();
    }
});

</script>

</body>
</html>
